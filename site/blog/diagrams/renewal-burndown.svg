<g data-node="coverage"><rect x="396" y="74" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="414" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Coverage check</text><text x="414" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Complete, current, nonconflicting</text></g>
