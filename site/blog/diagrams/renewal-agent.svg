<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="A planner proposes; the executor authorizes">
<title>A planner proposes; the executor authorizes</title>
<desc>Synthetic explanatory workflow. Scoped evidence packet leads to Provider adapter. Provider adapter leads to Validate plan boundary. Validate plan boundary leads to Domain executor. Domain executor leads to Record each step. Validate plan boundary leads to Reject the proposal. Domain executor leads to Reject the proposal.</desc>
<rect width="720" height="520" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 20</text>
