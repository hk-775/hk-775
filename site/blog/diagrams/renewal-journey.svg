<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="One renewal, six checkpoints">
<title>One renewal, six checkpoints</title>
<desc>Synthetic explanatory workflow. Contract record leads to Eligibility. Eligibility leads to Versioned offer. Versioned offer leads to Buyer accepts. Buyer accepts leads to Term begins. Term begins leads to Verify completion.</desc>
<rect width="720" height="520" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 01</text>
<path data-edge="0" d="M 324 115 H 396" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(396 115) rotate(0)"/>
<path data-edge="1" d="M 544 156 V 232" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(544 232) rotate(90)"/>
<path data-edge="2" d="M 396 273 H 324" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(324 273) rotate(180)"/>
<path data-edge="3" d="M 176 314 V 390" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(176 390) rotate(90)"/>
<path data-edge="4" d="M 324 431 H 396" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(396 431) rotate(0)"/>
<g data-node="record"><rect x="28" y="74" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><rect x="28" y="91" width="4" height="47" rx="2" fill="#00B4D8"/><text x="46" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Contract record</text><text x="46" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Verified terms + identity</text></g>
<g data-node="eligible"><rect x="396" y="74" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><rect x="396" y="91" width="4" height="47" rx="2" fill="#00B4D8"/><text x="414" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Eligibility</text><text x="414" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Current policy checks</text></g>
<g data-node="offer"><rect x="396" y="232" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><rect x="396" y="249" width="4" height="47" rx="2" fill="#00B4D8"/><text x="414" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Versioned offer</text><text x="414" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Price + term + expiry</text></g>
<g data-node="accept"><rect x="28" y="232" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><rect x="28" y="249" width="4" height="47" rx="2" fill="#00B4D8"/><text x="46" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Buyer accepts</text><text x="46" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Authority + exact version</text></g>
<g data-node="activate"><rect x="28" y="390" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><rect x="28" y="407" width="4" height="47" rx="2" fill="#00B4D8"/><text x="46" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Term begins</text><text x="46" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Billing + product access</text></g>
<g data-node="complete"><rect x="396" y="390" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><rect x="396" y="407" width="4" height="47" rx="2" fill="#00B4D8"/><text x="414" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Verify completion</text><text x="414" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Both provider states match</text></g>
<text x="28" y="503" fill="#435D6B" font-family="Arial, sans-serif" font-size="11">Illustrative flow · synthetic data · no timing scale</text>
</svg>
