<g data-node="complete"><rect x="396" y="390" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="414" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Renewal complete</text><text x="414" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Both outcomes verified</text></g>
<text x="28" y="503" fill="#435D6B" font-family="Arial, sans-serif" font-size="11">Illustrative flow · synthetic data · no timing scale</text>
