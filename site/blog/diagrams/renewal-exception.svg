<g data-node="record"><rect x="28" y="74" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="46" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Renewal packet</text><text x="46" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Terms + usage + open issues</text></g>
<g data-node="check"><rect x="396" y="74" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="414" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Classify the exception</text><text x="414" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Explain the failed checks</text></g>
