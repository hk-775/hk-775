<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="An approval belongs to one version">
<title>An approval belongs to one version</title>
<desc>Synthetic explanatory workflow. Catalog + contracts leads to Proposal version. Proposal version leads to Required approvals. Required approvals leads to Publish exact terms. Publish exact terms leads to Buyer acceptance. Required approvals leads to Prepare and review again. Buyer acceptance leads to Prepare and review again.</desc>
<rect width="720" height="520" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 06</text>
