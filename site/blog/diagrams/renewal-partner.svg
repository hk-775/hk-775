<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Delegate the work, retain the decision">
<title>Delegate the work, retain the decision</title>
<desc>Synthetic explanatory workflow. Source workflow task leads to Scoped assignment. Scoped assignment leads to Partner submits evidence. Partner submits evidence leads to Internal reviewer. Internal reviewer leads to Source task progresses. Scoped assignment leads to Assignment denied. Partner submits evidence leads to Assignment denied.</desc>
<rect width="720" height="520" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 15</text>
