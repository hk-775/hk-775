<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Forecast from the state of the work">
<title>Forecast from the state of the work</title>
<desc>Synthetic explanatory workflow. Contract + usage states leads to Separate forecast buckets. Separate forecast buckets leads to Save weekly snapshot. Save weekly snapshot leads to Match effective outcomes. Match effective outcomes leads to Review calibration. Save weekly snapshot leads to Keep unresolved rows.</desc>
<rect width="720" height="520" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 23</text>
