<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Stress the workflow across renewal cycles">
<title>Stress the workflow across renewal cycles</title>
<desc>Synthetic explanatory workflow. Disposable cohort leads to Actual domain functions. Actual domain functions leads to Synthetic provider events. Synthetic provider events leads to Check invariants. Check invariants leads to Bounded evidence report. Synthetic provider events leads to Unresolved outage backlog.</desc>
<rect width="720" height="520" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 25</text>
<path data-edge="0" d="M 324 115 H 396" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(396 115) rotate(0)"/>
<path data-edge="1" d="M 544 156 V 232" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(544 232) rotate(90)"/>
<path data-edge="2" d="M 396 273 H 324" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(324 273) rotate(180)"/>
<path data-edge="3" d="M 176 314 V 390" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(176 390) rotate(90)"/>
<path data-edge="4" d="M 544 314 V 390" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(544 390) rotate(90)"/>
<g data-node="seed"><rect x="28" y="74" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="46" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Disposable cohort</text><text x="46" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Seed + accounts + cycle count</text></g>
<g data-node="cycle"><rect x="396" y="74" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="414" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Actual domain functions</text><text x="414" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Prepare, accept, fulfill, promote</text></g>
<g data-node="provider"><rect x="396" y="232" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="414" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Synthetic provider events</text><text x="414" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Outages + receipts + payments</text></g>
<g data-node="check"><rect x="28" y="232" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="46" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Check invariants</text><text x="46" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Balances, duplicates, recovery</text></g>
<g data-node="report"><rect x="28" y="390" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="46" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Bounded evidence report</text><text x="46" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Digest + sampled histories</text></g>
<g data-node="backlog"><rect x="396" y="390" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="414" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Unresolved outage backlog</text><text x="414" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Do not label as completed</text></g>
<text x="28" y="503" fill="#435D6B" font-family="Arial, sans-serif" font-size="11">Illustrative flow · synthetic data · no timing scale</text>
</svg>
