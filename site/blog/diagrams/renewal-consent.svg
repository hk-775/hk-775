<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Acceptance is a checkpoint, too">
<title>Acceptance is a checkpoint, too</title>
<desc>Synthetic explanatory workflow. Current offer leads to Acceptance checks. Acceptance checks leads to Reject acceptance. Acceptance checks leads to Record agreement. Record agreement leads to Schedule next term. Schedule next term leads to Activate at start.</desc>
<rect width="720" height="520" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 03</text>
<path data-edge="0" d="M 324 115 H 396" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(396 115) rotate(0)"/>
<path data-edge="1" d="M 544 156 V 232" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(544 232) rotate(90)"/>
<path data-edge="2" d="M 544 156 V 192 H 176 V 232" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(176 232) rotate(90)"/>
<path data-edge="3" d="M 176 314 V 390" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(176 390) rotate(90)"/>
<path data-edge="4" d="M 324 431 H 396" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(396 431) rotate(0)"/>
<g data-node="offer"><rect x="28" y="74" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><rect x="28" y="91" width="4" height="47" rx="2" fill="#00B4D8"/><text x="46" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Current offer</text><text x="46" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Version + validity</text></g>
<g data-node="check"><rect x="396" y="74" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><rect x="396" y="91" width="4" height="47" rx="2" fill="#00B4D8"/><text x="414" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Acceptance checks</text><text x="414" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Buyer + consent + policy</text></g>
<g data-node="blocked"><rect x="396" y="232" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><rect x="396" y="249" width="4" height="47" rx="2" fill="#00B4D8"/><text x="414" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Reject acceptance</text><text x="414" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">No new agreement</text></g>
<g data-node="accepted"><rect x="28" y="232" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><rect x="28" y="249" width="4" height="47" rx="2" fill="#00B4D8"/><text x="46" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Record agreement</text><text x="46" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Exact offer + terms</text></g>
<g data-node="scheduled"><rect x="28" y="390" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><rect x="28" y="407" width="4" height="47" rx="2" fill="#00B4D8"/><text x="46" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Schedule next term</text><text x="46" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">No early activation</text></g>
<g data-node="activate"><rect x="396" y="390" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><rect x="396" y="407" width="4" height="47" rx="2" fill="#00B4D8"/><text x="414" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Activate at start</text><text x="414" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Verify both effects</text></g>
<text x="28" y="503" fill="#435D6B" font-family="Arial, sans-serif" font-size="11">Illustrative flow · synthetic data · no timing scale</text>
</svg>
