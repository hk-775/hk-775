<g data-node="worker"><rect x="380" y="452" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="398" y="485" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Worker Lambda</text><text x="398" y="511" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Bounded due-work processing</text></g>
<g data-node="dlq"><rect x="28" y="628" width="280" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="46" y="661" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Amazon SQS</text><text x="46" y="687" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Failed schedule delivery</text></g>
<g data-node="logs"><rect x="732" y="452" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="750" y="485" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">CloudWatch</text><text x="750" y="511" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Function logs and alarms</text></g>
<text x="28" y="763" fill="#435D6B" font-family="Arial, sans-serif" font-size="11">Illustrative flow · synthetic data · no timing scale</text>
</svg>
