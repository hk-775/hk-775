<g data-node="browser"><rect x="28" y="74" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="46" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Browser</text><text x="46" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Isolated synthetic workspace</text></g>
<g data-node="edge"><rect x="380" y="74" width="280" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="398" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">CloudFront + AWS WAF</text><text x="398" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">HTTPS + origin access control</text></g>
<g data-node="assets"><rect x="732" y="74" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="750" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Private Amazon S3</text><text x="750" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Static application assets</text></g>
<g data-node="api"><rect x="380" y="250" width="280" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="398" y="283" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">API Lambda</text><text x="398" y="309" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">IAM-authenticated function URL</text></g>
<g data-node="data"><rect x="732" y="250" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="750" y="283" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Amazon DynamoDB</text><text x="750" y="309" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Versioned workspace + due index</text></g>
