<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" width="1040" height="780" role="img" aria-label="The hosted demo: two paths through AWS">
<title>The hosted demo: two paths through AWS</title>
<desc>Synthetic explanatory workflow. Browser leads to CloudFront + AWS WAF. CloudFront + AWS WAF leads to Private Amazon S3. CloudFront + AWS WAF leads to API Lambda. API Lambda leads to Amazon DynamoDB. EventBridge Scheduler leads to Worker Lambda. Worker Lambda leads to Amazon DynamoDB. EventBridge Scheduler leads to Amazon SQS. API Lambda leads to CloudWatch.</desc>
<rect width="1040" height="780" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 26</text>
