<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Treat an imported record as a proposal">
<title>Treat an imported record as a proposal</title>
<desc>Synthetic explanatory workflow. Staged source envelope leads to Validate source boundary. Validate source boundary leads to Apply current evidence. Apply current evidence leads to Preserve import result. Validate source boundary leads to Quarantine the batch. Quarantine the batch leads to Resolve and restage.</desc>
<rect width="720" height="520" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 27</text>
<path data-edge="0" d="M 324 115 H 396" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(396 115) rotate(0)"/>
<path data-edge="1" d="M 544 156 V 232" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(544 232) rotate(90)"/>
<path data-edge="2" d="M 396 273 H 324" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(324 273) rotate(180)"/>
<path data-edge="3" d="M 544 156 V 207 H 360 V 431 H 324" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(324 431) rotate(180)"/>
<path data-edge="4" d="M 324 431 H 396" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(396 431) rotate(0)"/>
<g data-node="envelope"><rect x="28" y="74" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="46" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Staged source envelope</text><text x="46" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Event ID + mapping + digest</text></g>
<g data-node="validate"><rect x="396" y="74" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="414" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Validate source boundary</text><text x="414" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Account, version, identity, terms</text></g>
<g data-node="apply"><rect x="396" y="232" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="414" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Apply current evidence</text><text x="414" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Conditional source update</text></g>
<g data-node="receipt"><rect x="28" y="232" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="46" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Preserve import result</text><text x="46" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Replay deduplicated</text></g>
<g data-node="quarantine"><rect x="28" y="390" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="46" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Quarantine the batch</text><text x="46" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Named reason; no source change</text></g>
<g data-node="reconcile"><rect x="396" y="390" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="414" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Resolve and restage</text><text x="414" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Fresh mapping and source</text></g>
<text x="28" y="503" fill="#435D6B" font-family="Arial, sans-serif" font-size="11">Illustrative flow · synthetic data · no timing scale</text>
</svg>
