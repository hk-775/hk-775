<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Separate fitting, calibration and scoring">
<title>Separate fitting, calibration and scoring</title>
<desc>Synthetic explanatory workflow. Synthetic dated history leads to Fit on oldest 240. Fit on oldest 240 leads to Calibrate on next 60. Calibrate on next 60 leads to Score final 60. Score final 60 leads to Freeze forecast evidence. Synthetic dated history leads to Withhold prediction.</desc>
<rect width="720" height="520" rx="12" fill="#FAF8F3"/>
<text x="28" y="36" fill="#435D6B" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.3">RENEWAL STUDIO / FLOW 24</text>
<path data-edge="0" d="M 324 115 H 396" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(396 115) rotate(0)"/>
<path data-edge="1" d="M 544 156 V 232" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(544 232) rotate(90)"/>
<path data-edge="2" d="M 396 273 H 324" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(324 273) rotate(180)"/>
<path data-edge="3" d="M 176 314 V 390" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(176 390) rotate(90)"/>
<path data-edge="4" d="M 176 156 V 207 H 360 V 431 H 396" fill="none" stroke="#9AB2BF" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M -5 -4 L 1 0 L -5 4" fill="none" stroke="#9AB2BF" stroke-width="2" transform="translate(396 431) rotate(0)"/>
<g data-node="history"><rect x="28" y="74" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="46" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Synthetic dated history</text><text x="46" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">360 distinct cases; fixed seed</text></g>
<g data-node="fit"><rect x="396" y="74" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="414" y="107" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Fit on oldest 240</text><text x="414" y="133" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Usage, engagement, friction</text></g>
<g data-node="calibrate"><rect x="396" y="232" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="414" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Calibrate on next 60</text><text x="414" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Intercept adjustment</text></g>
<g data-node="test"><rect x="28" y="232" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="46" y="265" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Score final 60</text><text x="46" y="291" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Held-out Brier + reliability bins</text></g>
<g data-node="freeze"><rect x="28" y="390" width="296" height="82" rx="10" fill="#FFFFFF" stroke="#9AB2BF"/><text x="46" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Freeze forecast evidence</text><text x="46" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Model ID + features + currency</text></g>
<g data-node="unknown"><rect x="396" y="390" width="296" height="82" rx="10" fill="#EDF5F7" stroke="#9AB2BF"/><text x="414" y="423" fill="#0D1B2A" font-family="Arial, sans-serif" font-size="18" font-weight="600">Withhold prediction</text><text x="414" y="449" fill="#435D6B" font-family="Arial, sans-serif" font-size="13">Incomplete or unverified source</text></g>
<text x="28" y="503" fill="#435D6B" font-family="Arial, sans-serif" font-size="11">Illustrative flow · synthetic data · no timing scale</text>
</svg>
